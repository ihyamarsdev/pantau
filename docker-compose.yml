services:
  pantau:
    build: .
    container_name: pantau
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:15000-15019:15000-15019"
    volumes:
      - ./data:/app/data
      - ${HOME}/.ssh/config:/root/.ssh/config:ro
    environment:
      - PANTAU_PORT=8080
      - PANTAU_DB=/app/data/pantau.db

  # Optional Laya decision engine (sidecar). Pantau stays fully functional
  # without it; enable it by setting "Laya URL" to http://laya:8000 in
  # Settings > Notification Dispatcher.
  laya:
    image: qida/laya:latest
    container_name: pantau-laya
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    profiles: ["laya"]
    command: ["laya-serve"]
    environment:
      - LAYA_DEVICE=cpu
      - LAYA_MODEL=english
      - LAYA_DEFAULT_MODEL=english
      - LAYA_MODELS=english
      - LAYA_PRELOAD=1
      - LAYA_THREADS=4
      - LAYA_PORT=8000
    volumes:
      - laya-model-cache:/home/laya/.cache/huggingface
    init: true

volumes:
  laya-model-cache:
    name: "${COMPOSE_PROJECT_NAME:-pantau}_laya-model-cache"
