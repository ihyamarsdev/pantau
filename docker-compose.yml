services:
  pantau:
    build:
      context: .
      args:
        # Bakes the checksum-verified NetBird CLI into the image so the container can run its own
        # NetBird account (Settings -> Networks, driver netbird, mode "instance"). Set to "0" for a
        # leaner image; the openvpn and wireguard-tools clients are always included.
        WITH_NETBIRD: "1"
        WITH_NETCLIENT: "1"
    container_name: pantau
    restart: unless-stopped
    ports:
      - "${PANTAU_BIND:-0.0.0.0}:8080:8080"
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:15000-15019:15000-15019"
    # The host resolver is taken over by Tailscale's MagicDNS (100.100.100.100), which cannot
    # resolve the public management URLs of the other VPN networks. Give the container resolvers
    # that work regardless of the host's DNS state.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    cap_add:
      - NET_ADMIN # create the tunnel interface (netbird instance, wg-quick, openvpn)
      - NET_RAW   # bind an SSH socket to that interface (SO_BINDTODEVICE)
    devices:
      - /dev/net/tun:/dev/net/tun
    # Teleport: /app/data is persistent. Set a Teleport profile's teleport_home to /app/data/teleport/tsh-home so
    # `tsh login` survives "docker compose up --build". A global TELEPORT_HOME env is not used: Pantau strips it so
    # each profile controls its own home.
    volumes:
      - pantau-data:/app/data
      - ${HOME}/.ssh/config:/root/.ssh/config:ro
      - netbird-state:/var/lib/netbird # keeps the peer identity across "docker compose up --build"
    environment:
      - PANTAU_PORT=8080
      - PANTAU_DB=/app/data/pantau.db

volumes:
  pantau-data:
  netbird-state:
