services:
  pantau:
    build: .
    container_name: pantau
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - ./data:/app/data
      - ${HOME}/.ssh/config:/root/.ssh/config:ro
    environment:
      - PANTAU_PORT=8080
      - PANTAU_DB=/app/data/pantau.db
